    --cyan: #ff007f;
    --yellow: #ffe600;

  .mt { margin-top: 16px; }

  @media (min-width: 1024px) {

  @media (max-width: 640px) {
    #terminal { padding: 16px; }
    .clock, .foot-right { display: none; }

  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  @keyframes glow {

  function wirePhotoFallback(root) {
    var imgs = root.querySelectorAll("img[data-nf-photo]");

        if (img.dataset.hasFallback) return;
        img.dataset.hasFallback = "1";
        var d = document.createElement("div");
        d.className = "nf-fallback";
        d.setAttribute("role", "img");
        d.setAttribute("aria-label", PROFILE.name);
        d.textContent = "BKP";
        img.replaceWith(d);
      }
      if (img.complete && img.naturalWidth === 0) {
        replaceWithFallback();
      } else {
        img.addEventListener("error", replaceWithFallback);
      }
    });
  }

  function addEntry(command, output, isHtml) {
    var entry = document.createElement("div");
    entry.className = "entry";
    if (command) {
      var line = document.createElement("div");
      line.className = "cmdline";
      line.innerHTML = '<span class="prompt">bikash@portfolio:~$</span><span class="cmdtext"></span><span class="stamp">' +
        new Date().toLocaleTimeString() + "</span>";
      line.querySelector(".cmdtext").textContent = command;
      entry.appendChild(line);
    }
    var out = document.createElement("div");
    out.className = "out" + (isHtml ? "" : " plain");
    if (isHtml) out.innerHTML = output; else out.textContent = output;
    entry.appendChild(out);
    historyEl.appendChild(entry);
    wirePhotoFallback(entry);
    scrollDown();
  }

  function setLoading(v) {
    isLoading = v;
    if (busyEl) busyEl.hidden = !v;
    input.placeholder = v ? "Processing command..." : "Type 'help' or click any command...";

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        if (btn) {

          btn.textContent = "✓ Copied!";
          setTimeout(function () { btn.textContent = orig; }, 2000);
        }
      });
    }
  };

  /* ------------------------------------------------------------------ */
  /*  Command Execution & Dispatcher                                    */
  /* ------------------------------------------------------------------ */
  function runCommand(raw) {
    var trimmed = raw.trim();
    if (!trimmed) return;

    commandHistory.push(trimmed);
    historyIndex = -1;

    var parts = trimmed.split(/\s+/);
    var firstWord = parts[0].toLowerCase();
    var restArgs = trimmed.slice(parts[0].length).trim();
    var cleanFirst = firstWord.replace(/^\.\//, "");

    // Direct filename invocation (e.g. typing "resume.pdf" or "about.txt" directly)
    if (VFS[cleanFirst] && !commands[cleanFirst]) {
      setLoading(true);
      setTimeout(function () {
        addEntry(raw, VFS[cleanFirst].view(), true);
        setLoading(false);
      }, 40);
      return;
    }

    if (cleanFirst === "clear" || cleanFirst === "cls") {
      historyEl.innerHTML = "";
      return;
    }

    setLoading(true);
    setTimeout(function () {
      var c = commands[cleanFirst];
      if (c) {
        var out;
        if (typeof c.output === "function") {
          out = c.output(restArgs);
        } else {
          out = c.output;
        }
        addEntry(raw, out, typeof out === "string" && out.indexOf("<") !== -1);
      } else {
        // Check suggestions across commands and files
        var allTerms = names.concat(Object.keys(VFS));
        var sugg = allTerms.filter(function (n) {
          return n.indexOf(cleanFirst) !== -1 || cleanFirst.indexOf(n) !== -1;
        }).slice(0, 4);

        var html = '<div><div class="red" style="margin-bottom:8px">❌ Command not found: <span class="bold">' + esc(trimmed) + "</span></div>" +
          (sugg.length ? '<div class="muted">💡 Did you mean: ' + sugg.map(function (s) {
            return '<span class="cmd-pill" onclick="runCmd(\'' + esc(s) + '\')">' + esc(s) + "</span>";
          }).join(" ") + "</div>" : "") +
          '<div class="muted" style="margin-top:6px">Type <span class="cmd-pill" onclick="runCmd(\'help\')">help</span> to view all commands or <span class="cmd-pill" onclick="runCmd(\'ls\')">ls</span> to browse files.</div></div>';
        addEntry(raw, html, true);
      }
      setLoading(false);
    }, 40);
  }

  /* ------------------------------------------------------------------ */
  /*  Interactive Suggestions                                           */
  /* ------------------------------------------------------------------ */
  function renderSuggestions() {
    var v = input.value.trim().toLowerCase();
    if (!v) { suggestEl.innerHTML = ""; return; }

    var matches = [];
    if (v.indexOf("cat ") === 0 || v.indexOf("open ") === 0 || v.indexOf("view ") === 0) {
      var prefix = v.split(/\s+/)[0] + " ";
      var arg = v.slice(prefix.length).trim();
      var fKeys = Object.keys(VFS).filter(function (k) { return k !== "Bikash_Krishna_Panga_Resume_Revised.pdf"; });
      matches = fKeys
        .filter(function (f) { return !arg || f.indexOf(arg) === 0; })
        .slice(0, 6)
        .map(function (f) {
          return '<span class="s-chip" onclick="runCmd(\'' + prefix + f + '\')"><span class="s-name">' + prefix + f + '</span><span class="s-desc">(' + VFS[f].size + ')</span></span>';
        });
    } else {
      matches = names
        .filter(function (n) { return n.indexOf(v) === 0; })
        .slice(0, 6)
        .map(function (n) {
          return '<span class="s-chip" onclick="runCmd(\'' + n + '\')"><span class="s-name">' + n + '</span><span class="s-desc">- ' + commands[n].description + '</span></span>';
        });
    }

    suggestEl.innerHTML = matches.join("");
  }

  input.addEventListener("input", renderSuggestions);

  /* ------------------------------------------------------------------ */
  /*  Keyboard Navigation & Autocomplete                                */
  /* ------------------------------------------------------------------ */
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var v = input.value;
      input.value = "";
      renderSuggestions();
      runCommand(v);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (commandHistory.length) {
        historyIndex = historyIndex === -1 ? commandHistory.length - 1 : Math.max(0, historyIndex - 1);
        input.value = commandHistory[historyIndex];
      }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (historyIndex !== -1) {
        historyIndex++;
        if (historyIndex >= commandHistory.length) {
          historyIndex = -1;
          input.value = "";
        } else {
          input.value = commandHistory[historyIndex];
        }
      }
    } else if (e.key === "Tab") {
      e.preventDefault();
      var cur = input.value.trim().toLowerCase();
      if (!cur) return;

      if (cur.indexOf("cat ") === 0 || cur.indexOf("open ") === 0 || cur.indexOf("view ") === 0) {
        var pfx = cur.split(/\s+/)[0] + " ";
        var filePart = cur.slice(pfx.length).trim();
        var fNames = Object.keys(VFS).filter(function (k) { return k !== "Bikash_Krishna_Panga_Resume_Revised.pdf"; });
        var fileMatches = fNames.filter(function (f) { return f.indexOf(filePart) === 0; });
        if (fileMatches.length === 1) {
          input.value = pfx + fileMatches[0];
        } else if (fileMatches.length > 1) {
          addEntry(input.value + " <TAB>",
            '<div><div class="yellow bold mb">Matching files:</div><div class="chips">' +
            fileMatches.map(function (m) { return '<span class="cmd-pill" onclick="runCmd(\'' + pfx + m + '\')">' + m + '</span>'; }).join(" ") +
            '</div></div>', true);
        }
      } else {
        var cmdMatches = names.filter(function (n) { return n.indexOf(cur) === 0; });
        if (cmdMatches.length === 1) {
          input.value = cmdMatches[0];
        } else if (cmdMatches.length > 1) {
          addEntry(input.value + " <TAB>",
            '<div><div class="yellow bold mb">Matching commands:</div><div class="chips">' +
            cmdMatches.map(function (m) { return '<span class="cmd-pill" onclick="runCmd(\'' + m + '\')">' + m + '</span>'; }).join(" ") +
            '</div></div>', true);
        }
      }
      renderSuggestions();
    } else if (e.key === "Escape") {
      input.value = "";
      historyIndex = -1;
      renderSuggestions();
    } else if (e.ctrlKey && (e.key === "l" || e.key === "L")) {
      e.preventDefault();
      historyEl.innerHTML = "";
    } else if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
      e.preventDefault();
      addEntry(input.value + "^C", "", false);
      input.value = "";
      historyIndex = -1;
      renderSuggestions();
    }
  });
